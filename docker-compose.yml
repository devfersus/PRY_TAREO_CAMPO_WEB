services:
  frontend:
    image: nginx:alpine
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "127.0.0.1:3000:80"
    restart: unless-stopped
    environment:
      - BACKEND_HOST=${BACKEND_HOST}
      - BACKEND_PORT=5000
